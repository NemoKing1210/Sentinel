[package]
name = "sentinel"
version = "0.3.7"
description = "A focused VirusTotal desktop scanner"
authors = ["NemoKing"]
edition = "2021"
license = "MIT"
homepage = "https://github.com/NemoKing1210/Sentinel"
repository = "https://github.com/NemoKing1210/Sentinel"

[lib]
name = "sentinel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-single-instance = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
zip = "2.2"
tempfile = "3"
walkdir = "2"
urlencoding = "2"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.52"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
notify-rust = "4"
